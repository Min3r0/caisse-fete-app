<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>Caisse — comité des fêtes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caisse">
<style>
:root{
  --ink:#14171A; --paper:#F6F7F5; --card:#FFF; --line:#D9DCD7; --muted:#6B7169;
  --in:#0B6E4F; --out:#A32020; --move:#1F5BA8; --swap:#5B3FA8;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--paper);}
body{color:var(--ink);font-family:var(--display);min-height:100vh;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  max-width:540px;margin:0 auto;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:12px 13px;font-size:16px;color:var(--ink);width:100%;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--move);outline-offset:2px;}

.appbar{display:flex;align-items:baseline;justify-content:space-between;padding:6px 0 16px;}
.appbar.col{flex-direction:column;align-items:stretch;gap:5px;}
.appbar h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1;}
.retour{color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.1em;text-align:left;padding:0;}
.lienbar{color:var(--move);font-weight:700;font-size:13.5px;}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;}
.mono.gros{font-size:20px;}

.control{background:var(--ink);color:#fff;border-radius:12px;padding:13px 15px;margin-bottom:16px;}
.control .eyebrow{color:#9AA096;}
.control strong{display:block;font-family:var(--mono);font-size:24px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-top:5px;}
.control-grid{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid #333A33;}
.control-grid div{font-family:var(--mono);font-size:10px;color:#9AA096;text-transform:uppercase;letter-spacing:.07em;}
.control-grid b{display:block;color:#fff;font-size:13px;margin-top:3px;letter-spacing:0;}

.carte{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-bottom:9px;}
.carte-haut{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.carte-nom{font-weight:700;font-size:17px;letter-spacing:-.01em;}
.carte-sous{font-size:11.5px;color:var(--muted);margin-top:2px;}
.corr{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pos{color:var(--in);} .neg{color:var(--out);}

.bande{display:flex;height:9px;border-radius:2px;overflow:hidden;background:#E7E9E5;margin-top:11px;}
.bande i{display:block;}
.bande.vide{background:repeating-linear-gradient(90deg,#E7E9E5 0 6px,#F6F7F5 6px 12px);}

.vide{text-align:center;padding:40px 20px 30px;}
.vide .marque{font-size:52px;font-weight:800;color:#C4C9C2;}
.vide p{font-size:14px;color:var(--muted);line-height:1.55;margin-top:10px;}

.fab{display:block;width:100%;background:var(--ink);color:#fff;border-radius:12px;
  padding:15px;font-size:15px;font-weight:700;margin-top:18px;}
.fab[disabled]{opacity:.35;}
.fab.clair{background:var(--card);color:var(--ink);border:1px solid var(--line);}

.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:16px 0 6px;}
.aide{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;}
.aide.alerte{color:var(--out);}
.lien{color:var(--move);font-weight:700;font-size:12.5px;padding:0;}
.lien-inline{color:var(--move);font-weight:600;font-size:12px;text-decoration:underline;padding:0;}
.lien-bas{color:var(--muted);font-size:12.5px;padding:10px 0;width:100%;text-align:center;margin-top:12px;}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:4px 0 8px;}

.titre-section{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin:22px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line);}

.fond{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;}
.fond-haut{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.fond-origine{font-size:11.5px;color:var(--muted);margin-top:3px;}
.detail{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:5px;}
.detail-ligne{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;}
.puce{width:8px;height:8px;border-radius:1px;flex:none;}
.dnom{color:var(--muted);width:52px;} .dqte{font-weight:600;} .dval{margin-left:auto;color:var(--muted);}
.incomplet{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--out);}

.mv{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.mv-fleche{font-family:var(--mono);font-size:15px;font-weight:600;width:16px;flex:none;}
.mv-corps{flex:1;min-width:0;}
.mv-ligne{font-size:13.5px;line-height:1.35;}
.mv-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px;word-break:break-word;}
.mv-corps .bande{height:5px;margin-top:6px;}
.mv-droite{text-align:right;flex:none;}
.mv-droite .mono{font-size:14px;}
.suppr{color:var(--muted);font-size:10.5px;padding:4px 0 0;text-decoration:underline;}

.netbox{margin-top:20px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px;}
.netbox .eyebrow{color:var(--ink);}
.net{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;
  line-height:1.15;margin-top:3px;}
.netbox p{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px;}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px 8px;
  font-size:13px;font-weight:700;}
.b-in{border-color:var(--in);color:var(--in);}
.b-out{border-color:var(--out);color:var(--out);}
.b-move{border-color:var(--move);color:var(--move);}
.b-swap{border-color:var(--swap);color:var(--swap);}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.seg button{border:1.5px solid var(--line);border-radius:10px;padding:11px 6px;font-size:12.5px;
  font-weight:700;color:var(--muted);background:var(--card);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.seg button.on{border-color:var(--move);color:#fff;background:var(--move);}
.ligne-fleche{display:flex;align-items:center;gap:9px;}
.ligne-fleche span{font-family:var(--mono);font-size:16px;color:var(--muted);}
.fige{background:#EDEFEB;color:var(--muted);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.afficheur{background:var(--ink);color:#fff;border-radius:12px;padding:12px 15px;display:flex;
  justify-content:space-between;align-items:baseline;margin:20px 0 14px;position:sticky;top:0;z-index:2;}
.afficheur .eyebrow{color:#9AA096;}
.afficheur strong{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;}
.groupe{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:14px 0 8px;}
.ligne-c{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.vignette{color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:1px;
  flex:none;font-size:15px;}
.vignette em{font-style:normal;font-size:.65em;opacity:.85;}
.vignette.billet{height:32px;border-radius:3px;}
.vignette.piece{width:34px;height:34px;border-radius:50%;font-size:13px;margin-left:12px;}
.pas{width:42px;height:42px;border:1px solid var(--line);background:var(--card);border-radius:9px;
  font-size:20px;font-weight:600;flex:none;line-height:1;}
.qte{width:52px;height:42px;text-align:center;font-family:var(--mono);font-size:16px;font-weight:600;
  padding:0;flex:none;}
.qte.zero{color:#B7BCB5;}
.sous{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}

.cpt{border-bottom:1px solid var(--line);padding:11px 0;}
.cpt-haut{display:flex;justify-content:space-between;align-items:baseline;}
.cpt-nom{font-weight:700;font-size:16px;}
.cpt-op{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
.cpt-bas{display:flex;align-items:center;gap:10px;margin-top:8px;}
.cpt-bas input{max-width:180px;padding:9px 11px;font-size:15px;}
.cpt-recette{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--in);}

.verif{margin-top:16px;background:#FBEFEF;border:1px solid #E7C9C9;border-radius:12px;padding:12px 14px;}
.verif .eyebrow{color:var(--out);}
.verif p{font-size:12px;line-height:1.5;color:#5A2020;margin-top:6px;}
.formule{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--muted);margin-top:16px;}
.formule b{color:var(--ink);}

.voile{position:fixed;inset:0;background:rgba(20,23,26,.5);display:flex;align-items:flex-end;
  justify-content:center;z-index:50;}
.panneau{background:var(--paper);width:100%;max-width:540px;max-height:93vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom));
  animation:monte .2s ease-out;}
.panneau-haut{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;
  align-items:center;padding:16px 0 12px;border-bottom:1px solid var(--line);z-index:3;}
.panneau-haut h3{font-weight:700;font-size:18px;}
.panneau .afficheur{top:52px;}
@keyframes monte{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panneau{animation:none;}}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:99;max-width:88vw;text-align:center;}
textarea{width:100%;height:160px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);
  border-radius:10px;padding:10px;background:var(--card);}
</style>
</head>
<body>
<div id="root"></div>
<div id="panel"></div>
<script>
/* ===================== Données de référence ===================== */
var BILLETS=[50,20,10,5], PIECES=[2,1,0.5], COUPURES=[50,20,10,5,2,1,0.5];
var COULEUR={50:"#E8830C",20:"#2E5FB5",10:"#C41230",5:"#8A9196",2:"#A98A4E",1:"#9BA0A3",0.5:"#C39A4A"};
var LARGEUR={50:66,20:60,10:54,5:48};
var TYPES={
  apport:{titre:"Argent reçu",verbe:"Enregistrer l'apport",classe:"b-in"},
  transfert:{titre:"Transfert",verbe:"Enregistrer le transfert",classe:"b-move"},
  depense:{titre:"Dépense",verbe:"Enregistrer la dépense",classe:"b-out"},
  virement:{titre:"Virement contre liquide",verbe:"Enregistrer le virement",classe:"b-swap"}
};
var LIBTYPE={fond:"Fond d'ouverture",apport:"Apport",transfert:"Transfert",depense:"Dépense",virement:"Virement"};
var CLE="caisse-fete-v1";

/* ===================== Utilitaires ===================== */
function uid(){return Math.random().toString(36).slice(2,10);}
function eur(n){return (Math.round((n||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";}
function signe(n){return (n>=0?"+ ":"− ")+eur(Math.abs(n));}
function libC(d){return d<1?"0,50 €":d+" €";}
function totalC(c){var s=0;COUPURES.forEach(function(d){s+=d*((c&&c[d])||0);});return s;}
function montant(x){return x?(x.counts?totalC(x.counts):(x.manual||0)):0;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ===================== État ===================== */
var S={caisses:[],mvts:[]};
var vue={nom:"accueil"};

function charger(){
  try{var b=localStorage.getItem(CLE);if(b){var d=JSON.parse(b);S.caisses=d.caisses||[];S.mvts=d.mvts||[];}}
  catch(e){}
}
function sauver(){
  try{localStorage.setItem(CLE,JSON.stringify(S));}
  catch(e){toast("Enregistrement impossible. Faites une sauvegarde manuelle.");}
}

function caisseDe(id){for(var i=0;i<S.caisses.length;i++){if(S.caisses[i].id===id)return S.caisses[i];}return null;}
function nomDe(id){var c=caisseDe(id);return c?c.nom:"?";}
function fondDe(id){for(var i=0;i<S.mvts.length;i++){var m=S.mvts[i];if(m.type==="fond"&&m.toId===id)return m;}return null;}
function mvtsDe(id){return S.mvts.filter(function(m){return m.type!=="fond"&&(m.fromId===id||m.toId===id);});}

function calculer(){
  var corr={},ent={},sor={},apports=0,depenses=0,virements=0;
  S.caisses.forEach(function(c){corr[c.id]=0;ent[c.id]=0;sor[c.id]=0;});
  S.mvts.forEach(function(m){
    var a=montant(m);
    if(m.fromId&&corr[m.fromId]!==undefined){corr[m.fromId]+=a;sor[m.fromId]+=a;}
    if(m.toId&&corr[m.toId]!==undefined){corr[m.toId]-=a;ent[m.toId]+=a;}
    if(!m.fromId)apports+=a;
    if(m.type==="depense")depenses+=a;
    if(m.type==="virement")virements+=a;
  });
  var somme=0;for(var k in corr)somme+=corr[k];
  return {corr:corr,ent:ent,sor:sor,apports:apports,depenses:depenses,virements:virements,somme:somme};
}

/* ===================== Rendu ===================== */
var root=document.getElementById("root");
var panel=document.getElementById("panel");

function bande(counts){
  var t=totalC(counts);
  if(!t)return '<div class="bande vide"></div>';
  var h='<div class="bande">';
  COUPURES.forEach(function(d){
    if(counts[d])h+='<i style="width:'+((d*counts[d])/t*100)+'%;background:'+COULEUR[d]+'"></i>';
  });
  return h+'</div>';
}

function render(){
  if(vue.nom==="accueil")root.innerHTML=vueAccueil();
  else if(vue.nom==="caisse"){
    if(!caisseDe(vue.id)){vue={nom:"accueil"};return render();}
    root.innerHTML=vueCaisse();
  }
  else if(vue.nom==="comptage")root.innerHTML=vueComptage();
  else if(vue.nom==="donnees")root.innerHTML=vueDonnees();
  window.scrollTo(0,0);
}

/* ---------- Accueil ---------- */
function vueAccueil(){
  var c=calculer(),h="";
  h+='<div class="appbar"><h1>Caisses</h1>'+
     (S.caisses.length?'<button class="lienbar" data-act="comptage">Comptage →</button>':'')+'</div>';
  if(S.caisses.length){
    h+='<div class="control"><div class="eyebrow">Somme des corrections</div>'+
       '<strong>'+signe(c.somme)+'</strong><div class="control-grid">'+
       '<div>Apports<b>'+eur(c.apports)+'</b></div>'+
       '<div>Dépenses<b>'+eur(c.depenses)+'</b></div>'+
       '<div>Virements<b>'+eur(c.virements)+'</b></div></div></div>';
  } else {
    h+='<div class="vide"><div class="marque">€</div><p>Ouvrez une caisse pour chaque contenant '+
       "d'argent de la fête : Vendredi, Samedi, Tombola, Loto, Bar…</p></div>";
  }
  S.caisses.forEach(function(k){
    var f=fondDe(k.id),n=mvtsDe(k.id).length,corr=c.corr[k.id]||0;
    h+='<button class="carte" data-act="ouvrir" data-id="'+k.id+'">'+
       '<div class="carte-haut"><div><div class="carte-nom">'+esc(k.nom)+'</div>'+
       '<div class="carte-sous">'+(f?"Fond "+eur(montant(f)):"Pas de fond noté")+
       (n?" · "+n+" mouvement"+(n>1?"s":""):"")+'</div></div>'+
       '<div class="corr '+(corr>=0?"pos":"neg")+'">'+signe(corr)+'</div></div>'+
       bande(f&&f.counts?f.counts:null)+'</button>';
  });
  h+='<button class="fab" data-act="nouvelle">Ouvrir une caisse</button>';
  h+='<button class="fab clair" data-act="donnees">Sauvegarde et export</button>';
  return h;
}

/* ---------- Fiche caisse ---------- */
function vueCaisse(){
  var k=caisseDe(vue.id),c=calculer(),f=fondDe(k.id),ms=mvtsDe(k.id),corr=c.corr[k.id]||0,h="";
  h+='<div class="appbar col"><button class="retour" data-act="accueil">← Caisses</button>'+
     '<h1 data-act="renommer">'+esc(k.nom)+'</h1></div>';

  h+='<div class="titre-section">Fond d\'ouverture<button class="lien" data-act="fond">'+
     (f?"Modifier":"Compter")+'</button></div>';
  if(f){
    var src=f.fromId?nomDe(f.fromId):null;
    h+='<div class="fond"><div class="fond-haut"><div>'+
       '<div class="eyebrow">'+(src?"Repris de "+esc(src):"Apporté par le comité")+'</div>'+
       '<div class="fond-origine">'+(src?"La sortie est notée sur cette caisse-là":"Sera déduit du bénéfice")+'</div>'+
       '</div><div class="mono gros">'+eur(montant(f))+'</div></div>';
    if(f.counts){
      h+='<div class="detail">';
      COUPURES.forEach(function(d){
        if(f.counts[d])h+='<div class="detail-ligne"><span class="puce" style="background:'+COULEUR[d]+'"></span>'+
          '<span class="dnom">'+libC(d)+'</span><span class="dqte">× '+f.counts[d]+'</span>'+
          '<span class="dval">'+eur(d*f.counts[d])+'</span></div>';
      });
      h+='</div>';
    } else h+='<div class="incomplet">Montant global, coupures non détaillées</div>';
    h+='</div>';
  } else {
    h+='<p class="note">Notez le fond dès l\'ouverture, sinon la correction sera fausse.</p>';
  }

  h+='<div class="titre-section">Mouvements</div>';
  if(!ms.length)h+='<p class="note">Aucun mouvement.</p>';
  ms.forEach(function(m){
    var sort=m.fromId===k.id,ph;
    if(m.type==="apport")ph="Reçu de l'extérieur";
    else if(m.type==="depense")ph="Payé à <b>"+esc(m.tiers||"un fournisseur")+"</b>";
    else if(m.type==="virement")ph="Liquide remis à <b>"+esc(m.tiers||"quelqu'un")+"</b>";
    else ph=sort?("Transféré vers <b>"+esc(nomDe(m.toId))+"</b>"):("Reçu de <b>"+esc(nomDe(m.fromId))+"</b>");
    var meta=m.counts?COUPURES.filter(function(d){return m.counts[d];})
        .map(function(d){return m.counts[d]+" × "+libC(d);}).join(" · "):"montant global";
    h+='<div class="mv"><div class="mv-fleche '+(sort?"neg":"pos")+'">'+(sort?"↗":"↘")+'</div>'+
       '<div class="mv-corps"><div class="mv-ligne">'+ph+'</div>'+
       '<div class="mv-meta">'+esc(meta)+(m.note?" · "+esc(m.note):"")+'</div>'+
       (m.counts?bande(m.counts):"")+'</div>'+
       '<div class="mv-droite"><div class="mono">'+eur(montant(m))+'</div>'+
       '<button class="suppr" data-act="suppr-mvt" data-id="'+m.id+'">Supprimer</button></div></div>';
  });

  h+='<div class="netbox"><div class="eyebrow">Correction au comptage</div>'+
     '<div class="net '+(corr>=0?"pos":"neg")+'">'+signe(corr)+'</div><p>'+
     (corr>=0?"Le jour du comptage, ajoutez cette somme à ce que vous trouverez dans la caisse "+esc(k.nom)+"."
             :"Le jour du comptage, retranchez cette somme de ce que vous trouverez dans la caisse "+esc(k.nom)+".")+
     '</p></div>';

  h+='<div class="actions">';

}

/* ---------- Comptage ---------- */
function vueComptage(){
  var c=calculer(),h="";
  h+='<div class="appbar col"><button class="retour" data-act="accueil">← Caisses</button><h1>Comptage</h1></div>';
  h+='<p class="note">Comptez chaque caisse, saisissez le montant trouvé, la recette se calcule.</p>';
  var comptees=0,totalRec=0;
  S.caisses.forEach(function(k){
    var corr=c.corr[k.id]||0,a=typeof k.compte==="number";
    if(a){comptees++;totalRec+=k.compte+corr;}
    h+='<div class="cpt"><div class="cpt-haut"><span class="cpt-nom">'+esc(k.nom)+'</span>'+
       '<span class="cpt-op '+(corr>=0?"pos":"neg")+'">'+signe(corr)+'</span></div>'+
       '<div class="cpt-bas"><input inputmode="decimal" placeholder="Montant compté" data-compte="'+k.id+'" value="'+
       (a?String(k.compte).replace(".",","):"")+'">'+
       (a?'<span class="cpt-recette">Recette '+eur(k.compte+corr)+'</span>':'')+'</div></div>';
  });
  if(comptees){
    h+='<div class="control"><div class="eyebrow">Bénéfice'+(comptees<S.caisses.length?" provisoire":"")+'</div>'+
       '<strong>'+eur(totalRec-c.apports)+'</strong><div class="control-grid">'+
       '<div>Recettes<b>'+eur(totalRec)+'</b></div>'+
       '<div>Apports déduits<b>'+eur(c.apports)+'</b></div>'+
       '<div>Caisses comptées<b>'+comptees+" / "+S.caisses.length+'</b></div></div></div>';
  }
  var incompletes=S.mvts.filter(function(m){return !m.counts&&(m.manual||0)>0;}).length;
  var sansFond=S.caisses.filter(function(k){return !fondDe(k.id);});
  if(incompletes||sansFond.length){
    h+='<div class="verif"><div class="eyebrow">À vérifier avant de compter</div>';
    if(sansFond.length)h+='<p>Sans fond d\'ouverture noté : '+
      esc(sansFond.map(function(k){return k.nom;}).join(", "))+'. Leur correction est probablement fausse.</p>';
    if(incompletes)h+='<p>'+incompletes+' somme'+(incompletes>1?"s":"")+' saisie'+(incompletes>1?"s":"")+
      ' sans détail des coupures. Le total reste juste, mais le tableau des coupures sera incomplet.</p>';
    h+='</div>';
  }
  h+='<div class="formule">recette d\'une caisse<br>= <b>montant compté</b> + correction</div>';
  h+='<button class="fab" data-act="export">Exporter le tableur</button>';
  return h;
}

/* ===================== Compteur ===================== */
var compteur={counts:{},global:false,manuel:0};

function htmlCompteur(verbe,counts,manuel){
  compteur={counts:Object.assign({},counts||{}),global:!!(manuel&&!counts),manuel:manuel||0,verbe:verbe};
  return '<div id="cwrap">'+corpsCompteur()+'</div>';
}
function corpsCompteur(){
  var verbe=compteur.verbe;
  var h='<div class="afficheur"><span class="eyebrow">Total</span><strong id="ctotal">'+
    eur(compteur.global?compteur.manuel:totalC(compteur.counts))+'</strong></div>';
  if(compteur.global){
    h+='<div class="lbl">Montant</div><input id="cmanuel" inputmode="decimal" value="'+
       (compteur.manuel?String(compteur.manuel).replace(".",","):"")+'" placeholder="457">'+
       '<p class="aide alerte">Cette somme sera signalée comme incomplète : vous ne saurez pas, l\'an '+
       'prochain, de quelles coupures elle était faite.</p>'+
       '<button class="lien-bas" data-act="mode-detail">Revenir au détail des coupures</button>';
  } else {
    h+='<div class="groupe">Billets</div>';
    BILLETS.forEach(function(d){h+=ligneC(d,true);});
    h+='<div class="groupe">Pièces</div>';
    PIECES.forEach(function(d){h+=ligneC(d,false);});
    h+='<p class="aide">Pas le temps de détailler ? <button class="lien-inline" data-act="mode-global">Saisir un montant global</button></p>';
  }
  h+='<button class="fab" id="cvalider">'+esc(verbe)+'</button>';
  return h;
}
function ligneC(d,billet){
  var n=compteur.counts[d]||0;
  return '<div class="ligne-c">'+
    '<div class="vignette '+(billet?"billet":"piece")+'" style="background:'+COULEUR[d]+
      (billet?";width:"+LARGEUR[d]+"px":"")+'">'+(d<1?"0,50":d)+(d>=1?"<em>€</em>":"")+'</div>'+
    '<button class="pas" data-pas="-1" data-d="'+d+'" aria-label="Retirer">−</button>'+
    '<input class="qte'+(n?"":" zero")+'" inputmode="numeric" data-q="'+d+'" value="'+(n||"")+'" placeholder="0" aria-label="Nombre de '+libC(d)+'">'+
    '<button class="pas" data-pas="1" data-d="'+d+'" aria-label="Ajouter">+</button>'+
    '<div class="sous" data-sous="'+d+'">'+(n?eur(d*n):"")+'</div></div>';
}
function majCompteur(){
  var t=compteur.global?compteur.manuel:totalC(compteur.counts);
  var el=document.getElementById("ctotal");if(el)el.textContent=eur(t);
  COUPURES.forEach(function(d){
    var s=panel.querySelector('[data-sous="'+d+'"]');
    if(s)s.textContent=compteur.counts[d]?eur(d*compteur.counts[d]):"";
    var q=panel.querySelector('[data-q="'+d+'"]');
    if(q&&document.activeElement!==q){q.value=compteur.counts[d]||"";q.className="qte"+(compteur.counts[d]?"":" zero");}
  });
  var b=document.getElementById("cvalider");if(b)b.disabled=t<=0;
}
function valeurCompteur(){
  if(compteur.global)return {counts:null,manual:compteur.manuel};
  return {counts:Object.assign({},compteur.counts),manual:0};
}

/* ===================== Panneaux ===================== */
var panneauActif=null;
var validationCourante=null;
function surValidation(fn){
  validationCourante=fn;
  document.getElementById("cvalider").addEventListener("click",fn);
}
function ouvrirPanneau(titre,contenu,apres){

    '<h3>'+esc(titre)+'</h3><button class="lien" data-act="fermer">Fermer</button></div>'+
    '<div class="panneau-corps">'+contenu+'</div></div></div>';

  if(apres)apres();
  majCompteur();
}
function fermerPanneau(){panel.innerHTML="";panneauActif=null;validationCourante=null;}

function panneauFond(){
  var k=caisseDe(vue.id),f=fondDe(k.id);
  var autres=S.caisses.filter(function(c){return c.id!==k.id;});
  var opts='<option value="">Apporté par le comité</option>'+autres.map(function(c){
    return '<option value="'+c.id+'"'+(f&&f.fromId===c.id?" selected":"")+'>Repris de '+esc(c.nom)+'</option>';
  }).join("");
  var h='<div class="lbl">D\'où vient cet argent ?</div><select id="forigine">'+opts+'</select>'+
    '<p class="aide" id="faide"></p>'+htmlCompteur("Enregistrer le fond",f&&f.counts,f&&f.manual);
  ouvrirPanneau("Fond de "+k.nom,h,function(){
    var sel=document.getElementById("forigine"),aide=document.getElementById("faide");
    function maj(){aide.textContent=sel.value
      ?"La sortie sera enregistrée automatiquement sur la caisse d'origine."
      :"Cet argent vient de l'extérieur et sera déduit du bénéfice final.";}
    sel.addEventListener("change",maj);maj();
    surValidation(function(){
      var v=valeurCompteur();
      S.mvts=S.mvts.filter(function(m){return !(m.type==="fond"&&m.toId===k.id);});
      S.mvts.push({id:uid(),type:"fond",fromId:sel.value||null,toId:k.id,counts:v.counts,manual:v.manual});
      sauver();fermerPanneau();render();
    });
  });
}

function panneauMvt(type){
  var k=caisseDe(vue.id);
  var autres=S.caisses.filter(function(c){return c.id!==k.id;});
  var precedents=mvtsDe(k.id).filter(function(m){return m.type==="transfert";});
  var dernier=precedents.length?precedents[precedents.length-1]:null;
  var defaut=dernier?(dernier.fromId===k.id?dernier.toId:dernier.fromId):(autres[0]?autres[0].id:"");
  var etat={sens:"entrant"};
  var h="";

  if(type==="transfert"){
    h+='<div class="lbl">Sens du transfert</div><div class="seg">'+
       '<button class="on" data-sens="entrant">'+esc(k.nom)+' reçoit</button>'+
       '<button data-sens="sortant">'+esc(k.nom)+' donne</button></div>'+
       '<div class="lbl" id="tlbl">Argent pris dans</div>'+
       '<div class="ligne-fleche" id="tligne"></div><p class="aide" id="taide"></p>';
    if(!autres.length)h+='<p class="aide alerte">Créez d\'abord une autre caisse pour pouvoir transférer.</p>';
  }
  if(type==="depense")h+='<div class="lbl">Payé à</div><input id="mtiers" placeholder="Traiteur">';
  if(type==="virement")h+='<div class="lbl">Qui prend le liquide ?</div><input id="mtiers" placeholder="Cécile">'+
    '<p class="aide">Le liquide sort de '+esc(k.nom)+' et le même montant arrive sur le compte du comité.</p>';
  if(type==="apport")h+='<p class="aide">Argent apporté de l\'extérieur vers '+esc(k.nom)+
    ' : banque, coffre, avance d\'un membre du comité.</p>';

  h+='<div class="lbl">Commentaire</div><input id="mnote" placeholder="Facultatif">';
  h+=htmlCompteur(TYPES[type].verbe);

  ouvrirPanneau(TYPES[type].titre,h,function(){
    var selAutre=null;
    if(type==="transfert"){
      var ligne=document.getElementById("tligne"),lbl=document.getElementById("tlbl"),aide=document.getElementById("taide");
      function dessine(){
        var opts='<option value="">Choisir…</option>'+autres.map(function(c){
          return '<option value="'+c.id+'"'+(c.id===defaut?" selected":"")+'>'+esc(c.nom)+'</option>';}).join("");
        var fige='<div class="fige">'+esc(k.nom)+'</div>';
        var sel='<select id="tautre" style="flex:1;min-width:0">'+opts+'</select>';
        ligne.innerHTML=etat.sens==="entrant"?(sel+'<span>→</span>'+fige):(fige+'<span>→</span>'+sel);
        lbl.textContent=etat.sens==="entrant"?"Argent pris dans":"Argent versé dans";
        selAutre=document.getElementById("tautre");
        selAutre.addEventListener("change",function(){defaut=selAutre.value;majAide();});
        majAide();
      }
      function majAide(){
        var n=selAutre&&selAutre.value?nomDe(selAutre.value):null;
        aide.textContent=n?(etat.sens==="entrant"
          ?"La sortie sera notée sur "+n+" et l'entrée sur "+k.nom+"."
          :"La sortie sera notée sur "+k.nom+" et l'entrée sur "+n+"."):"Choisissez l'autre caisse.";
      }
      panel.querySelectorAll("[data-sens]").forEach(function(b){
        b.addEventListener("click",function(){
          etat.sens=b.getAttribute("data-sens");
          panel.querySelectorAll("[data-sens]").forEach(function(x){x.classList.toggle("on",x===b);});
          dessine();
        });
      });
      dessine();
    }
    surValidation(function(){
      if(type==="transfert"&&(!selAutre||!selAutre.value)){toast("Choisissez l'autre caisse.");return;}
      var v=valeurCompteur();
      var tiersEl=document.getElementById("mtiers"),noteEl=document.getElementById("mnote");
      var from,to;
      if(type==="apport"){from=null;to=k.id;}
      else if(type==="transfert"){
        if(etat.sens==="entrant"){from=selAutre.value;to=k.id;}else{from=k.id;to=selAutre.value;}
      } else {from=k.id;to=null;}
      S.mvts.push({id:uid(),type:type,fromId:from,toId:to,counts:v.counts,manual:v.manual,
        tiers:tiersEl?tiersEl.value.trim():"",note:noteEl?noteEl.value.trim():""});
      sauver();fermerPanneau();render();
    });
  });
}

    '<button class="fab" id="nok">'+esc(verbe)+'</button>',function(){

/* ===================== Export ===================== */
function num(n){return String(Math.round((n||0)*100)/100).replace(".",",");}
function csvLigne(cells){
  return cells.map(function(c){
    var s=String(c==null?"":c);
    return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(";");
}
function construireCSV(){
  var c=calculer(),L=[];
  L.push(["RECAPITULATIF"]);
  L.push(["Caisse","Fond d'ouverture","Entrees","Sorties","Correctif","Montant compte","Recette"]);
  S.caisses.forEach(function(k){
    var f=fondDe(k.id),a=typeof k.compte==="number";
    L.push([k.nom,num(f?montant(f):0),num(c.ent[k.id]),num(c.sor[k.id]),num(c.corr[k.id]),
      a?num(k.compte):"",a?num(k.compte+c.corr[k.id]):""]);
  });
  L.push([]);
  L.push(["Apports exterieurs",num(c.apports)]);
  L.push(["Depenses",num(c.depenses)]);
  L.push(["Virements recus sur le compte",num(c.virements)]);
  L.push(["Somme des correctifs",num(c.somme)]);
  L.push([]);L.push([]);

  L.push(["FONDS DE CAISSE - nombre de billets et de pieces"]);
  L.push(["Coupure"].concat(S.caisses.map(function(k){return k.nom;})).concat(["Total"]));
  var fonds=S.caisses.map(function(k){return fondDe(k.id);});
  COUPURES.forEach(function(d){
    var tot=0;
    var row=[libC(d)].concat(fonds.map(function(f){
      var q=(f&&f.counts&&f.counts[d])||0;tot+=q;return q;}));
    row.push(tot);L.push(row);
  });
  var sD=0,sG=0,sT=0,sM=0;
  L.push(["Valeur detaillee (EUR)"].concat(fonds.map(function(f){
    var v=f&&f.counts?totalC(f.counts):0;sD+=v;return num(v);})).concat([num(sD)]));
  L.push(["Saisi sans detail (EUR)"].concat(fonds.map(function(f){
    var v=f&&!f.counts?(f.manual||0):0;sG+=v;return num(v);})).concat([num(sG)]));
  L.push([]);
  L.push(["Total du fond (EUR)"].concat(fonds.map(function(f){
    var v=f?montant(f):0;sT+=v;return num(v);})).concat([num(sT)]));
  L.push(["Transferts, depenses et virements (EUR)"].concat(S.caisses.map(function(k,i){
    var v=(c.corr[k.id]||0)+(fonds[i]?montant(fonds[i]):0);sM+=v;return num(v);})).concat([num(sM)]));
  L.push(["CORRECTIF A APPLIQUER (EUR)"].concat(S.caisses.map(function(k){
    return num(c.corr[k.id]||0);})).concat([num(c.somme)]));
  L.push([]);L.push([]);

  L.push(["MOUVEMENTS"]);
  L.push(["Type","De","Vers","Personne","Montant","Detaille","Commentaire"]);
  S.mvts.forEach(function(m){
    L.push([LIBTYPE[m.type]||m.type,m.fromId?nomDe(m.fromId):"Exterieur",
      m.toId?nomDe(m.toId):"Sortie",m.tiers||"",num(montant(m)),m.counts?"oui":"non",m.note||""]);
  });
  L.push([]);L.push([]);

  L.push(["DETAIL DES COUPURES PAR MOUVEMENT"]);
  L.push(["Type","Caisse"].concat(COUPURES.map(libC)).concat(["Total"]));
  S.mvts.forEach(function(m){
    if(!m.counts)return;
    L.push([LIBTYPE[m.type]||m.type,m.fromId?nomDe(m.fromId):nomDe(m.toId)]
      .concat(COUPURES.map(function(d){return m.counts[d]||0;})).concat([num(montant(m))]));
  });
  L.push([]);L.push([]);

  L.push(["SYNTHESE PAR COUPURE - pour preparer l'an prochain"]);
  L.push(["Coupure","Quantite en fonds","Valeur en fonds","Quantite circulee","Valeur circulee"]);
  var enF={},circ={};COUPURES.forEach(function(d){enF[d]=0;circ[d]=0;});
  S.mvts.forEach(function(m){
    if(!m.counts)return;
    var cible=m.type==="fond"?enF:circ;
    COUPURES.forEach(function(d){cible[d]+=m.counts[d]||0;});
  });
  COUPURES.forEach(function(d){
    L.push([libC(d),enF[d],num(enF[d]*d),circ[d],num(circ[d]*d)]);
  });

  return "\ufeff"+L.map(csvLigne).join("\r\n");
}

function telecharger(nom,contenu,type){
  try{
    var b=new Blob([contenu],{type:type});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a");
    a.href=u;a.download=nom;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);
    toast("Fichier créé : "+nom);
  }catch(e){
    ouvrirPanneau("Copier le contenu",
      '<p class="aide">Le téléchargement a échoué. Copiez ce texte et collez-le dans un tableur.</p>'+
      '<textarea id="dump"></textarea><button class="fab" id="copie">Tout sélectionner</button>',
      function(){
        document.getElementById("dump").value=contenu;
        document.getElementById("copie").addEventListener("click",function(){
          var t=document.getElementById("dump");t.select();t.setSelectionRange(0,999999);
        });
      });
  }
}

function restaurer(){
  var inp=document.createElement("input");
  inp.type="file";inp.accept=".json,application/json";
  inp.addEventListener("change",function(){
    var f=inp.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d.caisses)throw 0;
        S.caisses=d.caisses;S.mvts=d.mvts||[];
        sauver();vue={nom:"accueil"};render();toast("Sauvegarde restaurée.");
      }catch(e){toast("Ce fichier n'est pas une sauvegarde valide.");}
    };
    r.readAsText(f);
  });
  inp.click();
}

/* ===================== Toast ===================== */
var tmr=null;
function toast(msg){
  var d=document.createElement("div");d.className="toast";d.textContent=msg;
  document.body.appendChild(d);clearTimeout(tmr);
  tmr=setTimeout(function(){d.remove();},2600);
}

/* ===================== Événements ===================== */
document.addEventListener("click",function(e){
  var pas=e.target.closest?e.target.closest("[data-pas]"):null;
  if(pas){
    var d=parseFloat(pas.getAttribute("data-d")),n=parseInt(pas.getAttribute("data-pas"),10);
    var v=Math.max(0,(compteur.counts[d]||0)+n);
    if(v)compteur.counts[d]=v;else delete compteur.counts[d];
    majCompteur();return;
  }
  var b=e.target.closest?e.target.closest("[data-act]"):null;
  if(e.target.getAttribute&&e.target.getAttribute("data-voile")){fermerPanneau();return;}
  if(!b)return;
  var act=b.getAttribute("data-act");

  if(act==="fermer"){fermerPanneau();}
  else if(act==="accueil"){vue={nom:"accueil"};render();}
  else if(act==="comptage"){vue={nom:"comptage"};render();}
  else if(act==="donnees"){vue={nom:"donnees"};render();}
  else if(act==="ouvrir"){vue={nom:"caisse",id:b.getAttribute("data-id")};render();}
  else if(act==="nouvelle"){
    panneauNom("Ouvrir une caisse","","Créer la caisse",function(nom){
      var id=uid();S.caisses.push({id:id,nom:nom,compte:null});sauver();
      vue={nom:"caisse",id:id};render();
    });
  }
  else if(act==="renommer"){
    var k=caisseDe(vue.id);
    panneauNom("Renommer",k.nom,"Renommer",function(nom){k.nom=nom;sauver();render();});
  }
  else if(act==="fond"){panneauFond();}
  else if(act==="mvt"){panneauMvt(b.getAttribute("data-type"));}
  else if(act==="suppr-mvt"){
    var id=b.getAttribute("data-id");
    S.mvts=S.mvts.filter(function(m){return m.id!==id;});sauver();render();toast("Mouvement supprimé.");
  }
  else if(act==="suppr-caisse"){
    var kk=caisseDe(vue.id);
    ouvrirPanneau("Supprimer "+kk.nom,
      '<p class="note">Cette caisse et tous ses mouvements seront effacés. Cette action est définitive.</p>'+
      '<div class="actions"><button class="btn" data-act="fermer">Annuler</button>'+
      '<button class="btn b-out" data-act="suppr-ok">Supprimer</button></div>');
  }
  else if(act==="suppr-ok"){
    var id2=vue.id;
    S.caisses=S.caisses.filter(function(c){return c.id!==id2;});
    S.mvts=S.mvts.filter(function(m){return m.fromId!==id2&&m.toId!==id2;});
    sauver();fermerPanneau();vue={nom:"accueil"};render();toast("Caisse supprimée.");
  }
  else if(act==="mode-global"){compteur.global=true;compteur.counts={};rafraichirCompteur();}
  else if(act==="mode-detail"){compteur.global=false;compteur.manuel=0;rafraichirCompteur();}
  else if(act==="export"){
    if(!S.caisses.length){toast("Aucune caisse à exporter.");return;}
    telecharger("caisse-fete.csv",construireCSV(),"text/csv;charset=utf-8");
  }
  else if(act==="backup"){
    telecharger("sauvegarde-caisse-"+new Date().toISOString().slice(0,10)+".json",
      JSON.stringify(S),"application/json");
  }
  else if(act==="restore"){restaurer();}
  else if(act==="raz"){
    ouvrirPanneau("Tout effacer",
      '<p class="note">Toutes les caisses et tous les mouvements seront supprimés. '+
      'Faites une sauvegarde avant si vous avez un doute.</p>'+
      '<div class="actions"><button class="btn" data-act="fermer">Annuler</button>'+
      '<button class="btn b-out" data-act="raz-ok">Tout effacer</button></div>');
  }
  else if(act==="raz-ok"){
    S={caisses:[],mvts:[]};sauver();fermerPanneau();vue={nom:"accueil"};render();toast("Données effacées.");
  }
});

/* Le compteur se reconstruit en place, sans refermer le panneau
   ni perdre le bouton de validation. */
function rafraichirCompteur(){
  var w=document.getElementById("cwrap");
  if(!w)return;
  w.innerHTML=corpsCompteur();
  if(validationCourante)document.getElementById("cvalider").addEventListener("click",validationCourante);
  majCompteur();
  var m=document.getElementById("cmanuel");
  if(m)m.focus();
}

document.addEventListener("input",function(e){
  var q=e.target.getAttribute&&e.target.getAttribute("data-q");
  if(q){
    var d=parseFloat(q),v=Math.max(0,parseInt(e.target.value,10)||0);
    if(v)compteur.counts[d]=v;else delete compteur.counts[d];
    var t=compteur.global?compteur.manuel:totalC(compteur.counts);
    document.getElementById("ctotal").textContent=eur(t);
    var s=panel.querySelector('[data-sous="'+d+'"]');if(s)s.textContent=v?eur(d*v):"";
    var b=document.getElementById("cvalider");if(b)b.disabled=t<=0;
    return;
  }
  if(e.target.id==="cmanuel"){
    compteur.manuel=parseFloat(e.target.value.replace(",","."))||0;
    document.getElementById("ctotal").textContent=eur(compteur.manuel);
    var b2=document.getElementById("cvalider");if(b2)b2.disabled=compteur.manuel<=0;
    return;
  }
  var cp=e.target.getAttribute&&e.target.getAttribute("data-compte");
  if(cp){
    var k=caisseDe(cp);
    var raw=e.target.value.trim();
    k.compte=raw===""?null:(parseFloat(raw.replace(",","."))||0);
    sauver();
    var bloc=e.target.parentNode.querySelector(".cpt-recette");
    var c=calculer();
    if(k.compte===null){if(bloc)bloc.remove();}
    else{
      if(!bloc){bloc=document.createElement("span");bloc.className="cpt-recette";e.target.parentNode.appendChild(bloc);}
      bloc.textContent="Recette "+eur(k.compte+(c.corr[k.id]||0));
    }
  }
});

charger();render();

/* Service worker : l'application reste utilisable sans réseau */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
