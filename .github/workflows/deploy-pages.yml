name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site (sans les fichiers du dépôt)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js *.png css js _site/
          # Nouvelle VERSION du cache à chaque publication :
          # les téléphones récupèrent automatiquement la mise à jour.
          sed -i "s/const VERSION = \"[^\"]*\";/const VERSION = \"caisse-${GITHUB_SHA::7}\";/" _site/sw.js
          grep "const VERSION" _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
